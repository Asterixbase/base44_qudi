<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Qudi — Interactive Feature Walkthrough</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --ink: #1A1208;
    --cream: #F7F2E8;
    --gold: #EBA020;
    --goldText: #B8860B;
    --white: #FFFFFF;
    --border: #E0DBC4;
    --muted: #6B5A3A;
    --hint: #C4B080;
    --green: #1B7A3A;
    --greenBg: #D4EDDA;
    --red: #C0392B;
    --redBg: #FCE4E4;
    --amber: #8A5C00;
    --amberBg: #FFF8E1;
    --teal: #008B94;
    --tealBg: #D1ECF1;
    --forest: #2D6A2D;
    --crimson: #8B1A1A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--ink);
    color: var(--cream);
    min-height: 100vh;
  }

  /* ─── TOP NAV ─── */
  .top-nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--ink);
    border-bottom: 2px solid var(--gold);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .top-nav .logo { font-size: 22px; font-weight: 800; color: var(--gold); }
  .top-nav .logo span { color: var(--cream); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .progress-bar { height: 4px; background: var(--gold); transition: width 0.4s; }

  /* ─── KENTE ─── */
  .kente { display: flex; height: 4px; width: 100%; flex-shrink: 0; }
  .kente div { flex: 1; }

  /* ─── LAYOUT ─── */
  .shell {
    display: grid;
    grid-template-columns: 280px 1fr 340px;
    height: calc(100vh - 54px);
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    background: #120E06;
    border-right: 1px solid rgba(235,160,32,0.2);
    overflow-y: auto;
    padding: 16px 0;
  }
  .sidebar-section-label {
    font-size: 10px; font-weight: 700; color: var(--hint);
    text-transform: uppercase; letter-spacing: 1px;
    padding: 12px 16px 6px;
  }
  .sidebar-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s; font-size: 13px; color: var(--hint);
  }
  .sidebar-item:hover { background: rgba(235,160,32,0.07); color: var(--cream); }
  .sidebar-item.active { border-left-color: var(--gold); background: rgba(235,160,32,0.12); color: var(--gold); font-weight: 700; }
  .sidebar-item .icon { font-size: 16px; width: 22px; text-align: center; }

  /* Main content */
  .main {
    overflow-y: auto;
    background: var(--cream);
    color: var(--ink);
  }

  /* Panel */
  .panel {
    overflow-y: auto;
    background: #0E0A04;
    border-left: 1px solid rgba(235,160,32,0.2);
    padding: 20px;
  }
  .panel h3 { color: var(--gold); font-size: 15px; font-weight: 800; margin-bottom: 12px; }
  .panel p { color: var(--hint); font-size: 12px; line-height: 1.7; margin-bottom: 10px; }
  .panel .tag { display: inline-block; background: rgba(235,160,32,0.15); color: var(--gold); border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 700; margin: 2px; }
  .panel .feature-list { margin: 8px 0 14px; padding-left: 16px; }
  .panel .feature-list li { color: var(--hint); font-size: 12px; line-height: 1.8; }

  /* Screen viewer */
  .screen-header {
    background: var(--ink);
    padding: 0;
  }
  .screen-header .s-inner { padding: 14px 16px 12px; display: flex; align-items: center; gap: 12px; }
  .screen-header .back { color: var(--cream); font-size: 20px; cursor: pointer; background: none; border: none; }
  .screen-header .title { color: var(--cream); font-weight: 700; font-size: 17px; }
  .screen-header .sub { color: var(--hint); font-size: 12px; }

  /* Cards */
  .card {
    background: var(--white);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 10px;
  }
  .card-header { background: var(--ink); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
  .card-header .ch-title { color: var(--gold); font-weight: 800; font-size: 13px; }
  .card-header .ch-sub { color: var(--hint); font-size: 11px; }
  .card-body { padding: 12px 14px; }

  /* Chips */
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; }
  .chip-green { background: var(--greenBg); color: var(--green); }
  .chip-amber { background: var(--amberBg); color: var(--amber); }
  .chip-red   { background: var(--redBg);   color: var(--red); }
  .chip-teal  { background: var(--tealBg);  color: var(--teal); }
  .chip-ink   { background: var(--ink);     color: var(--gold); }

  /* Avatar */
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }
  .av-sm { width: 30px; height: 30px; font-size: 10px; }

  /* Rows */
  .row { display: flex; align-items: center; gap: 10px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }

  /* Buttons */
  .btn-gold { background: var(--gold); color: var(--ink); border: none; border-radius: 10px; padding: 11px 18px; font-weight: 800; font-size: 13px; cursor: pointer; width: 100%; }
  .btn-outline { background: transparent; color: var(--goldText); border: 1.5px solid var(--goldText); border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 12px; cursor: pointer; }

  /* Trust bar */
  .trust-bar { height: 4px; border-radius: 2px; background: #eee; overflow: hidden; margin-top: 4px; }
  .trust-fill { height: 100%; border-radius: 2px; }

  /* Bottom nav mock */
  .bottom-nav { border-top: 1px solid var(--border); background: var(--white); display: flex; }
  .bottom-nav a { flex: 1; text-align: center; padding: 10px 4px 8px; font-size: 10px; color: var(--muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bottom-nav a.active { color: var(--goldText); font-weight: 700; }
  .bottom-nav a span { font-size: 16px; }

  /* Nav controls */
  .nav-controls { display: flex; align-items: center; gap: 8px; }
  .nav-btn { background: rgba(235,160,32,0.15); color: var(--gold); border: 1px solid rgba(235,160,32,0.3); border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .nav-btn:hover { background: var(--gold); color: var(--ink); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Section divider */
  .section-divider { height: 1px; background: var(--border); margin: 14px 0; }

  /* Mobile phone wrapper */
  .phone-wrap {
    display: flex; justify-content: center; align-items: flex-start;
    padding: 20px; background: var(--cream); min-height: 100%;
  }
  .phone {
    width: 100%; max-width: 390px;
    background: var(--white);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    min-height: 600px;
    display: flex; flex-direction: column;
  }

  /* Screen panels hidden/shown */
  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }

  /* Stat box */
  .stat-box { background: var(--ink); border-radius: 12px; padding: 12px 14px; text-align: center; }
  .stat-box .val { font-size: 20px; font-weight: 800; color: var(--gold); }
  .stat-box .lbl { font-size: 10px; color: var(--hint); margin-top: 2px; }

  /* Input mock */
  .input-mock { background: #F5F0E8; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--muted); width: 100%; margin-bottom: 8px; }

  /* Progress */
  .prog { height: 6px; border-radius: 3px; background: #eee; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 3px; background: var(--gold); }

  /* Timeline dot */
  .timeline-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
  .timeline-line { width: 2px; background: var(--border); flex: 1; min-height: 20px; }

  /* Scrollable inner content */
  .scroll-inner { overflow-y: auto; flex: 1; padding: 12px 14px; }

  /* Tooltip for features */
  .feature-badge { background: rgba(27,122,58,0.12); color: var(--green); border: 1px solid rgba(27,122,58,0.3); border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 700; display: inline-block; margin: 3px; }
  .feature-badge.new { background: rgba(235,160,32,0.12); color: var(--goldText); border-color: rgba(235,160,32,0.3); }

  /* Highlight box in panel */
  .highlight-box { background: rgba(235,160,32,0.08); border: 1px solid rgba(235,160,32,0.25); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .highlight-box .hb-title { color: var(--gold); font-weight: 800; font-size: 13px; margin-bottom: 6px; }

  /* Step indicator */
  .steps { display: flex; gap: 6px; margin-bottom: 14px; }
  .step { flex: 1; height: 4px; border-radius: 2px; background: rgba(235,160,32,0.2); }
  .step.done { background: var(--gold); }

  /* Gantt bar */
  .gantt-bar { height: 18px; border-radius: 4px; background: var(--gold); display: flex; align-items: center; padding: 0 6px; font-size: 10px; color: var(--ink); font-weight: 700; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar, .panel { display: none; }
  }
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-nav">
  <div class="logo">🫂 Qudi <span>Interactive Feature Walkthrough</span></div>
  <div class="nav-controls">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← Prev</button>
    <span style="color:var(--hint);font-size:12px;" id="pageCounter">1 / 20</span>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)">Next →</button>
  </div>
</div>
<div class="progress-bar" id="progressBar" style="width:5%"></div>

<!-- MAIN SHELL -->
<div class="shell">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- PHONE VIEWER -->
  <div class="main">
    <div class="phone-wrap">
      <div class="phone" id="phoneFrame"></div>
    </div>
  </div>

  <!-- PANEL -->

</div>

                <div style="flex:1;background:#F5F0E8;border-radius:6px;padding:6px 8px"><div style="font-size:10px;color:#6B5A3A">Invitee Bonus</div><div style="font-size:12px;font-weight:700">${r.ib}</div></div>
              </div>
            </div>
          </div>`;}).join('')}
      </div>`,
    title: 'Referral & Rewards Hub',
    desc: `Track member referrals and manage dual-sided rewards. Both the referrer and the new invitee earn bonuses when a referral successfully joins.`,
    features: ['Dual-sided rewards: referrer and invitee both benefit','Bonus types: Trust Score boost or Contribution Credit (GHS)','Status tracking: Pending → Joined → Rewarded','Summary stats: total referrals, joined count, rewarded count','Referral linked to specific circle','Reward note field for custom messages'],
    tags: ['Referrals','Rewards','Growth','Trust Boost','Credits']
  },
];

let current = 0;

function kente(h=4) {
  const c=['#EBA020','#1A1208','#2D6A2D','#8B1A1A','#EBA020','#1A1208','#2D6A2D','#8B1A1A'];
  return `<div class="kente" style="height:${h}px">${c.map(x=>`<div style="background:${x}"></div>`).join('')}</div>`;
}

function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  const sections = [...new Set(SCREENS.map(s => s.section))];
  let html = '';
  sections.forEach(sec => {
    html += `<div class="sidebar-section-label">${sec}</div>`;
    SCREENS.forEach((s, i) => {
      if (s.section !== sec) return;
      html += `<div class="sidebar-item ${i === current ? 'active' : ''}" id="si-${i}" onclick="goTo(${i})">
        <span class="icon">${s.icon}</span>${s.label}
      </div>`;
    });
  });
  sidebar.innerHTML = html;
}

function render() {
  const s = SCREENS[current];

  // Phone
  document.getElementById('phoneFrame').innerHTML = s.html();

  // Panel
  document.getElementById('panelTitle').textContent = s.title;
  document.getElementById('panelContent').innerHTML = `
    <div class="highlight-box">
      <div class="hb-title">What this screen does</div>
      <p style="color:var(--hint);font-size:12px;line-height:1.7;margin:0">${s.desc}</p>
    </div>
    <div style="margin-bottom:12px">
      ${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}
    </div>
    <p style="font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">Key Features</p>
    <ul class="feature-list">
      ${s.features.map(f => `<li>${f}</li>`).join('')}
    </ul>
  `;

  // Progress
  const pct = ((current + 1) / SCREENS.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('pageCounter').textContent = `${current + 1} / ${SCREENS.length}`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === SCREENS.length - 1;

  // Sidebar
  buildSidebar();

  // Scroll sidebar item into view
  const el = document.getElementById(`si-${current}`);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next >= SCREENS.length) return;
  current = next;
  render();
}

function goTo(idx) {
  current = idx;
  render();
}

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navigate(-1);
});

render();
</script>
</body>
</html>
